name: Beta verification

on:
  pull_request:
    paths:
      - '10_production_saas/**'
      - '.github/workflows/beta-ci.yml'
  push:
    branches: [main]
    paths:
      - '10_production_saas/**'
      - '.github/workflows/beta-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10_production_saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 10_production_saas/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
