name: Apply Beta 2 implementation payload

on:
  push:
    branches:
      - product/beta-2-experience-reset
    paths:
      - '.beta2-fix-payload/**'
      - '.github/workflows/beta2-apply-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Beta 2 branch
        uses: actions/checkout@v4
        with:
          ref: product/beta-2-experience-reset
          fetch-depth: 0
      - name: Apply verified compatibility payload
        shell: bash
        run: |
          set -euo pipefail
          payload='.beta2-fix-payload'
          if [[ ! -f "$payload/READY" ]]; then
            echo 'Payload is still being assembled; nothing to apply.'
            exit 0
          fi
          verify_part() {
            local name="$1" expected_bytes="$2" expected_sha="$3"
            local file="$payload/$name"
            [[ -f "$file" ]] || { echo "Missing $name"; exit 1; }
            local actual_bytes actual_sha
            actual_bytes="$(wc -c < "$file" | tr -d ' ')"
            actual_sha="$(sha256sum "$file" | cut -d' ' -f1)"
            [[ "$actual_bytes" == "$expected_bytes" ]] || { echo "$name byte length mismatch"; exit 1; }
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "$name sha256 mismatch"; exit 1; }
          }
          verify_part chunk-00 8000 1a36ba4ee551af4e753b17b766bd7297c20bbcbcb5b673a0d630831b5fdb120c
          verify_part chunk-01 8000 67354c5e06f8904ec6c9349a57a1767fb3da6a4e374bd7006584de53c7415190
          verify_part chunk-02 7428 89e633ab538a427c57ce3f1670537f3079b17fb40c35f7abccd8bbfdcb0e58b9
          cat "$payload"/chunk-* > /tmp/beta2-fix.tar.gz.b64
          base64 --decode /tmp/beta2-fix.tar.gz.b64 > /tmp/beta2-fix.tar.gz
          archive_sha="$(sha256sum /tmp/beta2-fix.tar.gz | cut -d' ' -f1)"
          [[ "$archive_sha" == 'f9366119443efaa0e715fbbc1c15f53ce9a838d7163d07c518a00c47c729763b' ]] || { echo 'Archive checksum mismatch'; exit 1; }
          tar -xzf /tmp/beta2-fix.tar.gz -C .
          rm -rf "$payload"
          git config user.name 'Roadmap Beta 2 Builder'
          git config user.email '64818593+landrydev@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve rich coaching detail in the Beta 2 experience'
          git push origin HEAD:product/beta-2-experience-reset
