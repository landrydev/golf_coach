name: Apply Beta 2 compatibility patch

on:
  push:
    branches:
      - product/beta-2-experience-reset
    paths:
      - '.github/workflows/beta2-apply-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Beta 2 branch
        uses: actions/checkout@v4
        with:
          ref: product/beta-2-experience-reset
          fetch-depth: 0
      - name: Apply exact verified patch
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode > /tmp/beta2-fix.patch.gz
          echo '0ff40669447384a52f624c1c6bd5f91fbb402828b663c194d1a51d5a244ab832  /tmp/beta2-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/beta2-fix.patch.gz > /tmp/beta2-fix.patch
          echo 'c1a419eed99d98041e9614123701dd299bdd5dbeb5364ee408980c49a970bf96  /tmp/beta2-fix.patch' | sha256sum -c -
          git apply --check /tmp/beta2-fix.patch
          git apply /tmp/beta2-fix.patch
          git config user.name 'Roadmap Beta 2 Builder'
          git config user.email '64818593+landrydev@users.noreply.github.com'
          git add 10_production_saas
          git commit -m 'fix: preserve rich coaching detail in the Beta 2 experience'
          git push origin HEAD:product/beta-2-experience-reset
