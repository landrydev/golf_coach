name: Beta 1 local experience

on:
  workflow_dispatch:
  push:
    branches:
      - beta/candidate-2026-08-11
    paths:
      - BETA1_START.ps1
      - BETA1_START.cmd
      - BETA1_HOME.html
      - BETA1_README.md
      - 10_production_saas/**
      - .github/workflows/beta1-local-experience.yml

permissions:
  contents: read

concurrency:
  group: beta1-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-package:
    name: Build, review, and package Beta 1
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out frozen Beta 1 source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: 10_production_saas/package-lock.json

      - name: Parse the Windows launcher
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw ./BETA1_START.ps1))
          Write-Host "BETA1_START.ps1 parses successfully."

      - name: Install the locked dependency graph
        working-directory: 10_production_saas
        run: npm ci --ignore-scripts

      - name: Run complete application verification
        working-directory: 10_production_saas
        run: npm run verify

      - name: Install Chromium for exact browser review
        working-directory: 10_production_saas
        run: npx playwright install --with-deps chromium

      - name: Review the full local Beta 1 surface
        working-directory: 10_production_saas
        run: node scripts/beta1-browser-smoke.mjs

      - name: Assemble the Windows local experience package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          staging = root / "beta1-package" / "Roadmap-Beta1"
          if staging.parent.exists():
              shutil.rmtree(staging.parent)
          staging.mkdir(parents=True)

          for name in [
              "BETA1_START.ps1",
              "BETA1_START.cmd",
              "BETA1_HOME.html",
              "BETA1_README.md",
          ]:
              shutil.copy2(root / name, staging / name)

          ignored = shutil.ignore_patterns(
              "node_modules",
              "dist",
              ".next",
              ".work",
              ".wrangler",
              "output",
              "coverage",
              "*.log",
              ".env",
              ".env.*",
          )
          shutil.copytree(
              root / "10_production_saas",
              staging / "10_production_saas",
              ignore=ignored,
          )
          shutil.make_archive(
              str(root / "Roadmap-Beta1-local"),
              "zip",
              root / "beta1-package",
              "Roadmap-Beta1",
          )
          PY

      - name: Upload Beta 1 package and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-beta1-local-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Roadmap-Beta1-local.zip
            10_production_saas/output/beta1-smoke/**
