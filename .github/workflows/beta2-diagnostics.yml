name: Beta 2 diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - product/beta-2-experience-reset
    paths:
      - '.github/workflows/beta2-diagnostics.yml'
      - '10_production_saas/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 10_production_saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: 10_production_saas/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Capture lint
        shell: bash
        run: |
          set +e
          npm run lint > ../beta2-lint.log 2>&1
          echo $? > ../beta2-lint.exit
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > ../beta2-typecheck.log 2>&1
          echo $? > ../beta2-typecheck.exit
      - name: Capture build
        shell: bash
        run: |
          set +e
          npm run build > ../beta2-build.log 2>&1
          echo $? > ../beta2-build.exit
      - name: Capture tests when build succeeds
        shell: bash
        run: |
          set +e
          if [[ "$(cat ../beta2-build.exit)" == "0" ]]; then
            npm test > ../beta2-test.log 2>&1
            echo $? > ../beta2-test.exit
          else
            echo "Skipped because build failed." > ../beta2-test.log
            echo 99 > ../beta2-test.exit
          fi
      - name: Summarize
        shell: bash
        run: |
          printf 'lint=%s\ntypecheck=%s\nbuild=%s\ntest=%s\n' \
            "$(cat ../beta2-lint.exit)" \
            "$(cat ../beta2-typecheck.exit)" \
            "$(cat ../beta2-build.exit)" \
            "$(cat ../beta2-test.exit)" > ../beta2-diagnostic-status.txt
          cat ../beta2-diagnostic-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beta2-diagnostics-${{ github.sha }}
          path: |
            beta2-*.log
            beta2-*.exit
            beta2-diagnostic-status.txt
          retention-days: 3
